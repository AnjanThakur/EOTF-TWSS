[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-emg"
version = "0.1.0"
description = "Local NPG Lite blink communication, guided calibration and honest evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pylsl>=1.17,<2", "pyttsx3>=2.98,<3", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
blink-to-speak = "blink_emg_app.__main__:main"

[tool.setuptools.packages.find]
include = ["blink_emg_app*"]
